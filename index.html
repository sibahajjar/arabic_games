<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arabic Letter Game</title>
    <!-- Load Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Load Tone.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.js"></script>
    <!-- Load Custom Styles -->
    <link rel="stylesheet" href="assets/css/style.css">
</head>

<body class="flex flex-col items-center min-h-screen py-8">

    <!-- Main Game Container -->
    <div id="game-container"
        class="relative w-full max-w-5xl p-4 flex flex-col items-center justify-center min-h-[50vh] my-auto">

        <!-- Welcome Screen (Mode Selection) -->
        <div id="welcome-screen"
            class="flex flex-col items-center justify-center text-center transition-opacity duration-500 w-full max-w-5xl">
            <p class="text-4xl sm:text-6xl text-indigo-800 mb-4 font-extrabold">لعبة الأبجدية الممتعة</p>
            <p class="text-xl sm:text-2xl text-gray-500 mb-10">اختر طريقة اللعب والتعلم</p>

            <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6 w-full px-4">
                <!-- Mode 2 Button: Correct Letter -->
                <button onclick="showSelectionScreen('letters')"
                    class="group relative flex flex-col items-center justify-center p-6 bg-white border-4 border-blue-400 rounded-3xl shadow-xl hover:bg-blue-50 hover:border-blue-500 transform hover:-translate-y-2 transition-all duration-300 w-full">
                    <div class="text-5xl mb-4">🧩</div>
                    <h3 class="text-2xl font-bold text-blue-700 mb-2">الحرف الصحيح</h3>
                    <p class="text-gray-500 text-sm">اختر الحرف الناقص</p>
                    <div class="mt-4 bg-blue-100 text-blue-800 px-3 py-1 rounded-full text-xs font-bold">أ ب ت ث</div>
                </button>

                <!-- Mode 1 Button: Shapes -->
                <button onclick="showSelectionScreen('shapes')"
                    class="group relative flex flex-col items-center justify-center p-6 bg-white border-4 border-green-400 rounded-3xl shadow-xl hover:bg-green-50 hover:border-green-500 transform hover:-translate-y-2 transition-all duration-300 w-full">
                    <div class="text-5xl mb-4">🎨</div>
                    <h3 class="text-2xl font-bold text-green-700 mb-2">أشكال الحروف</h3>
                    <p class="text-gray-500 text-sm">في البداية، الوسط، النهاية</p>
                    <div class="mt-4 bg-green-100 text-green-800 px-3 py-1 rounded-full text-xs font-bold">بـ ـبـ ـب
                    </div>
                </button>

                <!-- Mode 3 Button: Harakat -->
                <button onclick="showSelectionScreen('harakat')"
                    class="group relative flex flex-col items-center justify-center p-6 bg-white border-4 border-red-400 rounded-3xl shadow-xl hover:bg-red-50 hover:border-red-500 transform hover:-translate-y-2 transition-all duration-300 w-full">
                    <div class="text-5xl mb-4">📢</div>
                    <h3 class="text-2xl font-bold text-red-700 mb-2">الحركات</h3>
                    <p class="text-gray-500 text-sm">الفتحة، الضمة، الكسرة</p>
                    <div class="mt-4 bg-red-100 text-red-800 px-3 py-1 rounded-full text-xs font-bold">بَـ بُـ بِـ</div>
                </button>

                <!-- Mode 4 Button: Word Match (New) -->
                <button onclick="showLevelSelectionScreen()"
                    class="group relative flex flex-col items-center justify-center p-6 bg-white border-4 border-yellow-400 rounded-3xl shadow-xl hover:bg-yellow-50 hover:border-yellow-500 transform hover:-translate-y-2 transition-all duration-300 w-full">
                    <div class="text-5xl mb-4">🖼️</div>
                    <h3 class="text-2xl font-bold text-yellow-700 mb-2">الكلمة والصورة</h3>
                    <p class="text-gray-500 text-sm">اختر الصورة المناسبة</p>
                    <div class="mt-4 bg-yellow-100 text-yellow-800 px-3 py-1 rounded-full text-xs font-bold">أَب 👨🏻
                    </div>
                </button>

                <!-- Mode 5 Button: Teaching Writing (New) -->
                <button onclick="startWritingMode()"
                    class="group relative flex flex-col items-center justify-center p-6 bg-white border-4 border-purple-400 rounded-3xl shadow-xl hover:bg-purple-50 hover:border-purple-500 transform hover:-translate-y-2 transition-all duration-300 w-full">
                    <div class="text-5xl mb-4">✍️</div>
                    <h3 class="text-2xl font-bold text-purple-700 mb-2">الكتابة</h3>
                    <p class="text-gray-500 text-sm">اكتب الكلمة بالحروف</p>
                    <div class="mt-4 bg-purple-100 text-purple-800 px-3 py-1 rounded-full text-xs font-bold">كِـ ـتَـ ـا
                        ب</div>
                </button>

                <!-- Mode 6 Button: Reading Books (New) -->
                <button onclick="showBooksSelectionScreen()"
                    class="group relative flex flex-col items-center justify-center p-6 bg-white border-4 border-teal-400 rounded-3xl shadow-xl hover:bg-teal-50 hover:border-teal-500 transform hover:-translate-y-2 transition-all duration-300 w-full">
                    <div class="text-5xl mb-4">📚</div>
                    <h3 class="text-2xl font-bold text-teal-700 mb-2">قراءة القصص</h3>
                    <p class="text-gray-500 text-sm">قصص مصورة وممتعة</p>
                    <div class="mt-4 bg-teal-100 text-teal-800 px-3 py-1 rounded-full text-xs font-bold">زَيْدٌ يُسَاعِدُ النَاسَ 📖</div>
                </button>
            </div>
        </div>

        <!-- Books Selection Screen (Story Library) -->
        <div id="books-selection-screen"
            class="hidden flex flex-col items-center justify-center w-full max-w-5xl transition-opacity duration-500">
            <h2 class="text-4xl font-extrabold text-indigo-800 mb-2 text-center">📚 مكتبة القصص</h2>
            <p class="text-xl text-gray-500 mb-8 text-center">اختر قصة لتقرأ صفحاتها وتستمتع بها ✨</p>

            <div id="books-grid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-8 w-full px-4 mb-10">
                <!-- Book Cards will be safely rendered by JS -->
            </div>

            <button onclick="goHome()"
                class="px-10 py-3 bg-gray-200 text-gray-700 text-xl font-bold rounded-full hover:bg-gray-300 transition duration-300 shadow-md transform hover:scale-105">
                رجوع
            </button>
        </div>

        <!-- Story Reader Screen -->
        <div id="story-reader-screen"
            class="hidden flex flex-col items-center justify-center w-full max-w-4xl transition-opacity duration-500">

            <!-- Reader Top Bar -->
            <div class="flex justify-start items-center w-full max-w-3xl mb-4 px-2">
                <div class="flex items-center gap-2 sm:gap-3">
                    <button onclick="showBooksSelectionScreen()"
                        class="bg-white text-sm sm:text-base px-4 py-2 rounded-full shadow-md hover:bg-gray-100 text-indigo-700 font-bold transition transform hover:scale-105 border-2 border-indigo-200 flex items-center gap-2"
                        title="مكتبة القصص">
                        <span>📚</span>
                        <span>المكتبة</span>
                    </button>
                    <button onclick="goHome()"
                        class="bg-white text-xl sm:text-2xl p-2 rounded-full shadow-md hover:bg-gray-100 text-gray-700 transition transform hover:scale-110 border-2 border-gray-200"
                        title="الرئيسية">
                        🏠
                    </button>
                </div>
            </div>

            <!-- Story Page Main Card Container -->
            <div id="story-card"
                class="story-page-transition bg-white w-full max-w-3xl rounded-3xl shadow-2xl border-4 border-indigo-200 p-4 sm:p-6 mb-6 flex flex-col items-center relative overflow-hidden">
                
                <!-- Story Image Wrapper -->
                <div id="story-page-image-wrapper" class="rounded-2xl overflow-hidden bg-slate-50 border-2 border-slate-100 flex items-center justify-center shadow-inner relative">
                    <img id="story-page-image" src="" alt="صفحة القصة"
                        class="w-full h-full object-contain rounded-xl transition-all duration-300">
                </div>

                <!-- Story Text Box -->
                <div id="story-text-container" class="w-full mt-5 px-4 sm:px-6 py-4 bg-amber-50/80 rounded-2xl border border-amber-200 shadow-sm text-center">
                    <p id="story-page-text" class="text-2xl sm:text-3xl md:text-4xl font-extrabold text-indigo-950 tracking-wide text-center">
                        <!-- Text injected via JS -->
                    </p>
                </div>
            </div>

            <!-- Reader Navigation & Controls -->
            <div class="flex flex-col items-center w-full max-w-3xl gap-4">
                <div class="flex justify-between items-center w-full px-2 gap-3 sm:gap-4">
                    <!-- Prev Button (Right side in RTL) -->
                    <button id="story-prev-btn" onclick="prevStoryPage()"
                        class="p-3 sm:p-4 bg-indigo-600 hover:bg-indigo-700 text-white rounded-2xl shadow-lg transition duration-200 flex items-center justify-center disabled:opacity-40 disabled:cursor-not-allowed w-14 h-14 sm:w-16 sm:h-16 shrink-0"
                        title="الصفحة السابقة" aria-label="الصفحة السابقة">
                        <span class="text-2xl sm:text-3xl">➡️</span>
                    </button>

                    <!-- Page Number (in Arabic numbers) below in the middle -->
                    <div id="story-page-number" class="text-3xl sm:text-4xl font-extrabold text-indigo-950 bg-indigo-50 border-2 border-indigo-200 px-6 py-2 rounded-2xl shadow-sm min-w-[70px] text-center select-none">
                        ١
                    </div>

                    <!-- Next Button (Left side in RTL) -->
                    <button id="story-next-btn" onclick="nextStoryPage()"
                        class="p-3 sm:p-4 bg-emerald-600 hover:bg-emerald-700 text-white rounded-2xl shadow-lg transition duration-200 flex items-center justify-center w-14 h-14 sm:w-16 sm:h-16 shrink-0"
                        title="الصفحة التالية" aria-label="الصفحة التالية">
                        <span id="story-next-btn-icon" class="text-2xl sm:text-3xl">⬅️</span>
                    </button>
                </div>

                <!-- Swipe and Keyboard hint -->
                <p class="text-xs sm:text-sm text-gray-500 flex items-center gap-1.5 text-center mt-1">
                    <span>💡 يمكنك السحب بالإصبع 📱 أو استخدام مفاتيح الأسهم ⬅️ ➡️ لتقليب الصفحات</span>
                </p>
            </div>
        </div>


        <!-- Selection Screen -->
        <div id="selection-screen"
            class="hidden flex flex-col items-center justify-center w-full max-w-2xl transition-opacity duration-500">
            <h2 class="text-3xl font-bold text-indigo-800 mb-2">اختر الحروف</h2>
            <div
                class="flex items-center justify-between w-full max-w-xl mb-4 px-4 bg-gray-50 py-3 rounded-2xl border border-gray-100">
                <p id="selection-instruction" class="text-lg text-gray-600 mb-0">اختر 3 حروف على الأقل</p>

                <label class="inline-flex items-center cursor-pointer group">
                    <span class="ml-3 text-sm font-bold text-gray-600 group-hover:text-indigo-600 transition-colors">كل
                        الحروف</span>
                    <div class="relative">
                        <input type="checkbox" id="select-all-toggle" class="sr-only peer" onchange="selectAllToggle()">
                        <div
                            class="w-11 h-6 bg-gray-200 peer-focus:outline-none peer-focus:ring-4 peer-focus:ring-indigo-300 rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-5 after:w-5 after:transition-all peer-checked:bg-indigo-600">
                        </div>
                    </div>
                </label>
            </div>

            <div id="alphabet-grid" class="flex flex-wrap justify-center gap-2 mb-8 max-w-xl">
                <!-- Grid generated by JS -->
            </div>

            <div class="flex gap-4 w-full justify-center">
                <button onclick="goHome()"
                    class="px-6 py-3 bg-gray-300 text-gray-700 text-xl font-bold rounded-full hover:bg-gray-400 transition">
                    رجوع
                </button>
                <button id="start-game-btn" onclick="confirmSelectionAndStart()" disabled
                    class="px-8 py-3 bg-indigo-600 text-white text-xl font-bold rounded-full shadow-lg hover:bg-indigo-700 transition disabled:opacity-50 disabled:cursor-not-allowed">
                    ابدأ اللعب
                </button>
            </div>
        </div>
        <!-- Level Selection Screen (for Matching Mode) -->
        <div id="level-selection-screen"
            class="hidden flex flex-col items-center justify-center w-full max-w-2xl transition-opacity duration-500">
            <h2 class="text-3xl font-bold text-indigo-800 mb-6 font-extrabold text-center">اختر المستوى</h2>

            <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-4 gap-4 w-full px-4 mb-8">
                <!-- Level 1 -->
                <button onclick="startMatchingGame(1)"
                    class="group flex flex-col items-center justify-center p-6 bg-white border-4 border-yellow-400 rounded-3xl shadow-xl hover:bg-yellow-50 hover:border-yellow-500 transform hover:-translate-y-2 transition-all duration-300">
                    <div class="text-4xl mb-3">⭐</div>
                    <h3 class="text-xl font-bold text-yellow-700 mb-1">المستوى ١</h3>
                    <p class="text-gray-500 text-xs text-center">من أ إلى ز</p>
                </button>

                <!-- Level 2 -->
                <button onclick="startMatchingGame(2)"
                    class="group flex flex-col items-center justify-center p-6 bg-white border-4 border-orange-400 rounded-3xl shadow-xl hover:bg-orange-50 hover:border-orange-500 transform hover:-translate-y-2 transition-all duration-300">
                    <div class="text-4xl mb-3">⭐⭐</div>
                    <h3 class="text-xl font-bold text-orange-700 mb-1">المستوى ٢</h3>
                    <p class="text-gray-500 text-xs text-center">من أ إلى غ</p>
                </button>

                <!-- Level 3 -->
                <button onclick="startMatchingGame(3)"
                    class="group flex flex-col items-center justify-center p-6 bg-white border-4 border-red-400 rounded-3xl shadow-xl hover:bg-red-50 hover:border-red-500 transform hover:-translate-y-2 transition-all duration-300">
                    <div class="text-4xl mb-3">⭐⭐⭐</div>
                    <h3 class="text-xl font-bold text-red-700 mb-1">المستوى ٣</h3>
                    <p class="text-gray-500 text-xs text-center">كل الحروف</p>
                </button>

                <!-- Level 4 -->
                <button onclick="startMatchingGame(4)"
                    class="group flex flex-col items-center justify-center p-6 bg-white border-4 border-emerald-400 rounded-3xl shadow-xl hover:bg-emerald-50 hover:border-emerald-500 transform hover:-translate-y-2 transition-all duration-300">
                    <div class="text-4xl mb-3">⭐⭐⭐⭐</div>
                    <h3 class="text-xl font-bold text-emerald-700 mb-1">المستوى ٤</h3>
                    <p class="text-gray-500 text-xs text-center">كلمات جديدة</p>
                </button>
            </div>

            <!-- Options/Settings for Matching Mode -->
            <div class="flex items-center justify-center gap-3 mb-6 bg-gray-50 px-6 py-3 rounded-2xl border border-gray-100 shadow-sm mt-4">
                <label class="inline-flex items-center cursor-pointer group">
                    <span class="ml-3 text-lg font-bold text-gray-700 group-hover:text-indigo-600 transition-colors">إخفاء الصور في البداية (اقرأ الكلمة أولاً)</span>
                    <div class="relative">
                        <input type="checkbox" id="hide-images-toggle" class="sr-only peer">
                        <div class="w-11 h-6 bg-gray-200 peer-focus:outline-none peer-focus:ring-4 peer-focus:ring-indigo-300 rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-5 after:w-5 after:transition-all peer-checked:bg-emerald-500"></div>
                    </div>
                </label>
            </div>

            <button onclick="goHome()"
                class="px-10 py-3 bg-gray-200 text-gray-700 text-xl font-bold rounded-full hover:bg-gray-300 transition duration-300 shadow-md">
                رجوع
            </button>
        </div>
        <!-- Game Screen -->
        <div id="game-screen"
            class="hidden flex flex-col items-center justify-center w-full transition-opacity duration-500">

            <!-- Header: Home, Score, Lives -->
            <div class="flex justify-between items-center w-full max-w-lg mb-4">
                <div class="flex items-center gap-3">
                    <!-- Home Button -->
                    <button onclick="goHome()"
                        class="bg-white text-2xl p-2 rounded-full shadow-md hover:bg-gray-100 text-gray-700 transition-transform transform hover:scale-110 border-2 border-gray-200"
                        aria-label="الرئيسية">
                        🏠
                    </button>
                    <div id="score-display" class="text-xl text-gray-600 font-bold">النقاط: 0</div>
                </div>
                <div id="lives-display" class="text-3xl"></div>
            </div>

            <!-- Question Card -->
            <div id="question-card"
                class="bg-white p-6 sm:p-12 w-full max-w-lg rounded-3xl shadow-2xl border-4 border-yellow-400 mb-10 transform transition-all duration-300 flex flex-col items-center">

                <!-- Visual Display (Image or Emoji) -->
                <div id="word-visual"
                    class="emoji-visual rounded-lg mb-6 shadow-md border-2 border-gray-200 bg-gray-50">
                    <!-- Content injected via JS -->
                </div>

                <p id="word-placeholder"
                    class="word-display text-center font-extrabold text-indigo-700 whitespace-nowrap">
                    <!-- Arabic Word will be displayed here -->
                </p>
                <div id="position-hint" class="text-lg text-gray-500 text-center mt-2"></div>
            </div>

            <!-- Options Grid and Toggle Button Wrapper -->
            <div class="relative w-full max-w-lg sm:max-w-xl mt-6">
                <!-- Reveal Images Button (for matching mode with hidden images) -->
                <div id="reveal-container" class="absolute -top-12 right-4 z-10 hidden">
                    <button id="reveal-toggle-btn" onclick="toggleMatchingImages()"
                        class="p-2.5 bg-emerald-100 hover:bg-emerald-200 text-emerald-700 rounded-full shadow-md border border-emerald-200 transition-all duration-200 transform hover:scale-105 active:scale-95 flex items-center justify-center w-10 h-10"
                        title="أظهر/أخفِ الصور" aria-label="أظهر/أخفِ الصور">
                        <!-- Eye Icon (Show) -->
                        <svg id="eye-show-icon" xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                          <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
                          <path stroke-linecap="round" stroke-linejoin="round" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />
                        </svg>
                        <!-- Eye Off Icon (Hide) -->
                        <svg id="eye-hide-icon" xmlns="http://www.w3.org/2000/svg" class="w-5 h-5 hidden" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                          <path stroke-linecap="round" stroke-linejoin="round" d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.88 9.88l-3.29-3.29m7.532 7.532l3.29 3.29M3 3l3.59 3.59m0 0A9.953 9.953 0 0112 5c4.478 0 8.268 2.943 9.543 7a10.025 10.025 0 01-4.132 5.411m0 0L21 21" />
                        </svg>
                    </button>
                </div>

                <!-- Options Grid -->
                <div id="options-grid" class="flex flex-wrap justify-center gap-4 w-full">
                    <!-- Buttons will be generated here -->
                </div>
            </div>
        </div>

    </div>

    <!-- Fun Reward Elements -->
    <div id="confetti-holder" class="confetti-container hidden"></div>

    <!-- Load Game Scripts -->
    <script src="assets/js/data.js"></script>
    <script src="assets/js/script.js"></script>
</body>

</html>
